name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client:
        description: 'Specific client to deploy (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - ipatechs
          - jensen

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - client: ipatechs
            project_name: ipatechs-odooflow
          - client: jensen
            project_name: jensen-odooflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_ODOO_URL: ${{ secrets[format('{0}_ODOO_URL', matrix.client)] }}
          NEXT_PUBLIC_ODOO_DB: ${{ secrets[format('{0}_ODOO_DB', matrix.client)] }}

      - name: Install Vercel CLI (v53)
        run: npm install -g vercel@53.4.0

      - name: Pull Vercel Project Info
        run: |
          vercel link --yes --token=${{ env.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build with Vercel
        run: |
          vercel build --prod --token=${{ env.VERCEL_TOKEN }} --build-env ODOO_URL=${{ secrets[format('{0}_ODOO_URL', matrix.client)] }} --build-env ODOO_DB=${{ secrets[format('{0}_ODOO_DB', matrix.client)] }} --build-env ODOO_USER=${{ secrets[format('{0}_ODOO_USER', matrix.client)] }} --build-env ODOO_PASSWORD=${{ secrets[format('{0}_ODOO_PASSWORD', matrix.client)] }} --build-env ODOO_COMPANY_NAME=${{ secrets[format('{0}_ODOO_COMPANY_NAME', matrix.client)] }} --build-env ODOO_COMPANY_TIN=${{ secrets[format('{0}_ODOO_COMPANY_TIN', matrix.client)] }} --build-env ODOO_COMPANY_VRN=${{ secrets[format('{0}_ODOO_COMPANY_VRN', matrix.client)] }} --build-env ODOO_COMPANY_ADDRESS=${{ secrets[format('{0}_ODOO_COMPANY_ADDRESS', matrix.client)] }} --build-env ODOO_COMPANY_PHONE=${{ secrets[format('{0}_ODOO_COMPANY_PHONE', matrix.client)] }} --build-env ODOO_COMPANY_EMAIL=${{ secrets[format('{0}_ODOO_COMPANY_EMAIL', matrix.client)] }} --build-env ODOO_COMPANY_WEBSITE=${{ secrets[format('{0}_ODOO_COMPANY_WEBSITE', matrix.client)] }} --build-env ODOO_COMPANY_CITY=${{ secrets[format('{0}_ODOO_COMPANY_CITY', matrix.client)] }} --build-env ODOO_COMPANY_COUNTRY=${{ secrets[format('{0}_ODOO_COMPANY_COUNTRY', matrix.client)] }} --build-env ODOOFLOW_PDF_PRIMARY=${{ secrets[format('{0}_ODOOFLOW_PDF_PRIMARY', matrix.client)] }} --build-env ODOOFLOW_PDF_PRIMARY_DARK=${{ secrets[format('{0}_ODOOFLOW_PDF_PRIMARY_DARK', matrix.client)] }} --build-env ODOOFLOW_PDF_ACCENT=${{ secrets[format('{0}_ODOOFLOW_PDF_ACCENT', matrix.client)] }}

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}

      - name: Deployment Status
        if: always()
        run: |
          echo "Deployment for ${{ matrix.client }}: ${{ job.status }}"