name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client:
        description: 'Specific client to deploy (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - ipatechs
          - jensen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Deploy ipatechs
        if: github.event_name == 'push' || github.event.inputs.client == 'all' || github.event.inputs.client == 'ipatechs'
        uses: vercel/action@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project: ipatechs-odooflow
          vercel-args: '--prod'
        env:
          ODOO_URL: ${{ secrets.IPATECHS_ODOO_URL }}
          ODOO_DB: ${{ secrets.IPATECHS_ODOO_DB }}
          ODOO_USER: ${{ secrets.IPATECHS_ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.IPATECHS_ODOO_PASSWORD }}
          ODOO_COMPANY_NAME: ${{ secrets.IPATECHS_ODOO_COMPANY_NAME }}
          ODOO_COMPANY_TIN: ${{ secrets.IPATECHS_ODOO_COMPANY_TIN }}
          ODOO_COMPANY_VRN: ${{ secrets.IPATECHS_ODOO_COMPANY_VRN }}
          ODOO_COMPANY_ADDRESS: ${{ secrets.IPATECHS_ODOO_COMPANY_ADDRESS }}
          ODOO_COMPANY_PHONE: ${{ secrets.IPATECHS_ODOO_COMPANY_PHONE }}
          ODOO_COMPANY_EMAIL: ${{ secrets.IPATECHS_ODOO_COMPANY_EMAIL }}
          ODOO_COMPANY_WEBSITE: ${{ secrets.IPATECHS_ODOO_COMPANY_WEBSITE }}
          ODOO_COMPANY_CITY: ${{ secrets.IPATECHS_ODOO_COMPANY_CITY }}
          ODOO_COMPANY_COUNTRY: ${{ secrets.IPATECHS_ODOO_COMPANY_COUNTRY }}
          ODOOFLOW_PDF_PRIMARY: ${{ secrets.IPATECHS_ODOOFLOW_PDF_PRIMARY }}
          ODOOFLOW_PDF_PRIMARY_DARK: ${{ secrets.IPATECHS_ODOOFLOW_PDF_PRIMARY_DARK }}
          ODOOFLOW_PDF_ACCENT: ${{ secrets.IPATECHS_ODOOFLOW_PDF_ACCENT }}

      - name: Deploy jensen
        if: github.event_name == 'push' || github.event.inputs.client == 'all' || github.event.inputs.client == 'jensen'
        uses: vercel/action@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project: jensen-odooflow
          vercel-args: '--prod'
        env:
          ODOO_URL: ${{ secrets.JENSEN_ODOO_URL }}
          ODOO_DB: ${{ secrets.JENSEN_ODOO_DB }}
          ODOO_USER: ${{ secrets.JENSEN_ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.JENSEN_ODOO_PASSWORD }}
          ODOO_COMPANY_NAME: ${{ secrets.JENSEN_ODOO_COMPANY_NAME }}
          ODOO_COMPANY_TIN: ${{ secrets.JENSEN_ODOO_COMPANY_TIN }}
          ODOO_COMPANY_VRN: ${{ secrets.JENSEN_ODOO_COMPANY_VRN }}
          ODOO_COMPANY_ADDRESS: ${{ secrets.JENSEN_ODOO_COMPANY_ADDRESS }}
          ODOO_COMPANY_PHONE: ${{ secrets.JENSEN_ODOO_COMPANY_PHONE }}
          ODOO_COMPANY_EMAIL: ${{ secrets.JENSEN_ODOO_COMPANY_EMAIL }}
          ODOO_COMPANY_WEBSITE: ${{ secrets.JENSEN_ODOO_COMPANY_WEBSITE }}
          ODOO_COMPANY_CITY: ${{ secrets.JENSEN_ODOO_COMPANY_CITY }}
          ODOO_COMPANY_COUNTRY: ${{ secrets.JENSEN_ODOO_COMPANY_COUNTRY }}
          ODOOFLOW_PDF_PRIMARY: ${{ secrets.JENSEN_ODOOFLOW_PDF_PRIMARY }}
          ODOOFLOW_PDF_PRIMARY_DARK: ${{ secrets.JENSEN_ODOOFLOW_PDF_PRIMARY_DARK }}
          ODOOFLOW_PDF_ACCENT: ${{ secrets.JENSEN_ODOOFLOW_PDF_ACCENT }}